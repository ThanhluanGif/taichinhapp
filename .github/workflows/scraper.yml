name: Run News RSS Scraper

on:
  schedule:
    # Runs every 3 hours
    - cron: '0 */3 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scraper/requirements.txt

      - name: Run Scraper Script
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        run: |
          python scraper/main.py

      - name: Commit and Push Updated Data (Fallback JSON)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add web-app/public/data/news.json scraper/data/news.json || true
          git diff --quiet && git diff --staged --quiet || (git commit -m "auto: Cập nhật tin tức RSS mới nhất [skip ci]" && git push)
